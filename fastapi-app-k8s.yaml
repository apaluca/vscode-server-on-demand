---
# ConfigMap for environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: vscode-manager-config
data:
  KUBERNETES_NAMESPACE: "default"
  BASE_DOMAIN: "vscode.local"
---
# Service account with appropriate permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vscode-manager-sa
---
# Role with permissions to manage VS Code Server resources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vscode-manager-role
rules:
- apiGroups: [""]
  resources: ["configmaps", "services", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Role binding for the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vscode-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vscode-manager-role
subjects:
- kind: ServiceAccount
  name: vscode-manager-sa
---
# Deployment for the FastAPI application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscode-manager
  labels:
    app: vscode-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vscode-manager
  template:
    metadata:
      labels:
        app: vscode-manager
    spec:
      serviceAccountName: vscode-manager-sa
      containers:
      - name: api
        image: vscode-manager:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: vscode-manager-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
# Service to expose the FastAPI application
apiVersion: v1
kind: Service
metadata:
  name: vscode-manager-service
spec:
  selector:
    app: vscode-manager
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
# Ingress for the FastAPI application
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vscode-manager-ingress
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  tls:
  - hosts:
    - api.vscode.local
    secretName: vscode-server-tls
  rules:
  - host: api.vscode.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vscode-manager-service
            port:
              number: 80